<html>
    <input type="text" id="inputField" placeholder="Type something...">
    <button id="submitButton">Submit</button>
    <p id="output"></p>
</html>


<script>
    const domanda = document.getElementById('inputField');
    const submitButton = document.getElementById('submitButton');
    const output = document.getElementById('output');

const risposteGeneriche = [
    "Sì, direi proprio di sì.",
    "No, non ci conterei troppo.",
    "Forse... il Marione è indeciso.",
    "Le stelle non sono chiarissime.",
    "Direi 50 e 50.",
    "Chiedimelo più tardi.",
    "Oggi il Marione è ottimista.",
    "Meglio non sapere tutto in anticipo."
];

const risposteAmore = [
    "Qui sento delle vibrazioni interessanti 👀",
    "Potrebbe esserci qualcosa.",
    "Non correre troppo con la fantasia.",
    "Secondo me devi osservare meglio i segnali.",
    "Il Marione vede confusione sentimentale.",
    "Possibilità ce ne sono.",
    "Occhio a non diventare troppo preso.",
    "In amore il Marione non garantisce nulla."
];

const risposteGaming = [
    "Oggi si scala.",
    "Prevedo una lose evitabile.",
    "Il matchmaking non sarà dalla tua parte.",
    "Se non tilti, hai speranze.",
    "Il Marione vede punti rank in arrivo.",
    "Questa sa di partita da carry.",
    "Meglio riscaldare le mani prima.",
    "Il team farà cose discutibili."
];


const paroleAmore = [
    "amore",
    "ragazza",
    "ragazzo",
    "fidanzata",
    "fidanzato",
    "ama",
    "piaccio",
    "crush"
];

const paroleGaming = [
    "valorant",
    "league",
    "lol",
    "rank",
    "vinco",
    "partita",
    "game",
    "elo"
];



    submitButton.addEventListener('click', function() {
        const testoNormalizzato = domanda.value.toLowerCase().trim();
        if (testoNormalizzato.startsWith('!ball')) {
            const testoDomanda = testoNormalizzato.slice(5).trim();
            const risposta = getRandomResponse(testoDomanda);
            output.textContent = risposta;
            domanda.value = '';
        } else {
            output.textContent = "Devi iniziare la domanda con !ball";
        }
    });


function getRandomResponse(testoDomanda) {

        if (testoDomanda === "") {
            return "Devi farmi una domanda!";
        }

        else if (paroleAmore.some(word => testoDomanda.includes(word))) {

            const randomIndex = Math.floor(
                Math.random() * risposteAmore.length
            );

            const rispostaCasuale = risposteAmore[randomIndex];

            return rispostaCasuale;
        }

        else if (paroleGaming.some(word => testoDomanda.includes(word))) {

            const randomIndex = Math.floor(
                Math.random() * risposteGaming.length
            );

            const rispostaCasuale = risposteGaming[randomIndex];
return rispostaCasuale;
            
        }

        else {

            const randomIndex = Math.floor(
                Math.random() * risposteGeneriche.length
            );

            const rispostaCasuale = risposteGeneriche[randomIndex];

           return rispostaCasuale;
        }

    }
    
</script>
